license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
#logoFile="examplemod.png"
credits=""
authors="${mod_authors}"
description='''
Memento In Abyss.
'''

[modproperties.${mod_id}]
"sodium:config_api_user" = "com.altnoir.mementoinabyss.compat.SodiumConfigEntryPoint"

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[${curios_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fzzy_config"
    type="required"
    versionRange="[${fzzyconfig_version},)"
    ordering="AFTER"
    side="BOTH"

#[features.${mod_id}]
#openGLVersion="[3.2,)"
