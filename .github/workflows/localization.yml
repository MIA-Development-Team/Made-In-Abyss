name: Localization
on:
  push:
    branches:
      - 1.21.1-NeoForge
jobs:
  crowdin:
    if: github.repository == 'MIA-Development-Team/Made-In-Abyss'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: crowdin action
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          crowdin_branch_name: ${{ github.ref_name }}
          localization_branch_name: l10n/${{ github.ref_name }}
          create_pull_request: true
          pull_request_title: 'chore(l10n): new crowdin translations'
          pull_request_body: 'New Crowdin translations by [Crowdin GH Action](https://github.com/crowdin/github-action)'
          pull_request_base_branch_name: ${{ github.ref_name }}
          config: .github/crowdin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
