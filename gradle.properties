org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The JDKs on this machine live outside the locations Gradle auto-detects. Without these two lines
# the foojay resolver tries to download a JDK 25 from api.foojay.io during configuration and the
# build stalls there instead of failing.
org.gradle.java.installations.paths=D:/Minecraft/Lib/temurin-21.0,D:/Minecraft/Lib/temurin-25.0
org.gradle.java.installations.auto-download=false

minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.109

mesa_loader=libs/mesa-loader-windows-26.0.4-x64.jar

